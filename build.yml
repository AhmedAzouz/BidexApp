name: Build Bidex APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Project Files
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/bidex/webview
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bidex"
          include(":app")
          EOF

          # 2. build.gradle.kts (root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.bidex.webview"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.bidex.webview"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  debug {
                      isDebuggable = true
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.activity:activity-ktx:1.8.2")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:theme="@style/Theme.Bidex">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity" android:exported="false"/>
              </application>
          </manifest>
          EOF

          # 6. Dummy App Icon
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#1976D2"/>
          </shape>
          EOF

          # 7. network_security_config.xml
          cat << 'EOF' > app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true"/>
          </network-security-config>
          EOF

          # 8. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bidex</string>
              <string name="settings">Settings</string>
              <string name="reload">Reload</string>
              <string name="save">Save</string>
              <string name="server_url_label">Robot server URL</string>
              <string name="url_saved">URL saved</string>
              <string name="url_empty">Enter a URL</string>
          </resources>
          EOF

          # 9. themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Bidex" parent="Theme.MaterialComponents.DayNight.DarkActionBar">
                  <item name="colorPrimary">#1976D2</item>
                  <item name="colorPrimaryVariant">#0D47A1</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="android:statusBarColor">?attr/colorPrimaryVariant</item>
              </style>
          </resources>
          EOF

          # 10. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webView"
              android:layout_width="match_parent"
              android:layout_height="match_parent"/>
          EOF

          # 11. activity_settings.xml
          cat << 'EOF' > app/src/main/res/layout/activity_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical"
              android:padding="24dp"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <TextView
                  android:text="@string/server_url_label"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>
              <EditText
                  android:id="@+id/urlInput"
                  android:inputType="textUri"
                  android:hint="http://192.168.1.20:5080"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>
              <Button
                  android:id="@+id/saveButton"
                  android:text="@string/save"
                  android:layout_marginTop="16dp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>
          </LinearLayout>
          EOF

          # 12. main_menu.xml
          cat << 'EOF' > app/src/main/res/menu/main_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/action_reload" android:title="@string/reload" android:showAsAction="never"/>
              <item android:id="@+id/action_settings" android:title="@string/settings" android:showAsAction="never"/>
          </menu>
          EOF

          # 13. Prefs.kt
          cat << 'EOF' > app/src/main/java/com/bidex/webview/Prefs.kt
          package com.bidex.webview
          import android.content.Context
          object Prefs {
              private const val FILE = "bidex_prefs"
              private const val KEY_URL = "server_url"
              const val DEFAULT_URL = "http://192.168.1.20:5080"
              fun getUrl(ctx: Context): String =
                  prefs(ctx).getString(KEY_URL, DEFAULT_URL) ?: DEFAULT_URL
              fun setUrl(ctx: Context, raw: String) {
                  prefs(ctx).edit().putString(KEY_URL, normalize(raw)).apply()
              }
              fun normalize(raw: String): String {
                  val t = raw.trim()
                  return if (t.startsWith("http://") || t.startsWith("https://")) t else "http://$t"
              }
              private fun prefs(ctx: Context) =
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)
          }
          EOF

          # 14. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/bidex/webview/MainActivity.kt
          package com.bidex.webview
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.os.Bundle
          import android.view.Menu
          import android.view.MenuItem
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  webView = findViewById(R.id.webView)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          request.grant(request.resources)
                      }
                  }
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack() else finish()
                      }
                  })
                  loadSavedUrl()
              }
              override fun onResume() {
                  super.onResume()
                  loadSavedUrl()
              }
              private fun loadSavedUrl() {
                  webView.loadUrl(Prefs.getUrl(this))
              }
              override fun onCreateOptionsMenu(menu: Menu): Boolean {
                  menuInflater.inflate(R.menu.main_menu, menu)
                  return true
              }
              override fun onOptionsItemSelected(item: MenuItem): Boolean = when (item.itemId) {
                  R.id.action_reload -> { webView.reload(); true }
                  R.id.action_settings -> {
                      startActivity(Intent(this, SettingsActivity::class.java)); true
                  }
                  else -> super.onOptionsItemSelected(item)
              }
          }
          EOF

          # 15. SettingsActivity.kt
          cat << 'EOF' > app/src/main/java/com/bidex/webview/SettingsActivity.kt
          package com.bidex.webview
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class SettingsActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)
                  val input = findViewById<EditText>(R.id.urlInput)
                  input.setText(Prefs.getUrl(this))
                  findViewById<Button>(R.id.saveButton).setOnClickListener {
                      val value = input.text.toString()
                      if (value.isBlank()) {
                          Toast.makeText(this, R.string.url_empty, Toast.LENGTH_SHORT).show()
                      } else {
                          Prefs.setUrl(this, value)
                          Toast.makeText(this, R.string.url_saved, Toast.LENGTH_SHORT).show()
                          finish()
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bidex-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
